# =============================================================================
# Auto-merge de PRs de promoción entre ramas de larga vida (repo-convention).
#
# El flujo de AI27 es: feature -> *-d -> *-q -> *-m.
#   - feature -> *-d : lo revisas y fusionas tú (revisión real).
#   - *-d -> *-q     : PR siempre abierto y resumido (promotion-pr-dq.yml), pero
#                      lo fusionas tú a mano. NO se auto-fusiona.
#   - *-q -> *-m     : esto SÍ se auto-fusiona cuando CI pasa en verde.
#
# Qué cuenta como "promoción auto-fusionable" (lo único que toca este workflow):
#   - head termina en  -q  y base termina en  -m
# Cualquier otro PR (feature -> *-d, y *-d -> *-q) se ignora: lo manejas tú.
#
# El merge usa --merge (merge commit), no squash/rebase: squash reescribiría la
# historia y rompería el diff de la siguiente promoción entre ramas de larga vida.
#
# Idéntico en los 8 repos PPE con CI. No hay prefijos hardcodeados: la relación
# de promoción se deriva del sufijo de rama. Instalar junto al ci.yml existente.
# =============================================================================
name: automerge-promotion

on:
  # Se dispara cuando TODA la CI de un commit termina. Es el gate "en verde".
  check_suite:
    types: [completed]
  # Captura PRs sin checks (p. ej. repos aún sin CI) y recién abiertos.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar auto-merge en PRs de promoción en verde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SUITE_CONCLUSION: ${{ github.event.check_suite.conclusion }}
          SUITE_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 1) Resolver el/los PR(s) a evaluar según el evento.
          if [ "$EVENT" = "pull_request" ]; then
            prs="$PR_NUMBER"
          else
            # check_suite: localizar PRs abiertos cuyo head sea el SHA evaluado.
            prs=$(gh pr list --repo "$REPO" --state open \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid==\"$SUITE_HEAD_SHA\") | .number")
          fi

          if [ -z "${prs//[[:space:]]/}" ]; then
            echo "No hay PR abierto que evaluar para este evento."
            exit 0
          fi

          for pr in $prs; do
            echo "::group::Evaluando PR #$pr"

            base=$(gh pr view "$pr" --repo "$REPO" --json baseRefName --jq .baseRefName)
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq .headRefName)
            state=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)

            if [ "$state" != "OPEN" ]; then
              echo "PR #$pr no está abierto ($state); se omite."
              echo "::endgroup::"; continue
            fi

            # 2) ¿Es la promoción auto-fusionable q->m? Derivado del sufijo.
            #    d->q queda fuera a propósito: esa la fusionas tú a mano.
            promo=no
            case "$head:$base" in
              *-q:*-m) promo=yes ;;
            esac

            if [ "$promo" != "yes" ]; then
              echo "PR #$pr ($head -> $base) no es promoción q->m; lo manejas tú. Se omite."
              echo "::endgroup::"; continue
            fi

            # 3) Gate de CI. En check_suite exigimos success. En pull_request,
            #    si el repo tiene checks, --auto espera a que terminen; si no
            #    los tiene, se fusiona de inmediato (comportamiento esperado).
            if [ "$EVENT" = "check_suite" ] && [ "$SUITE_CONCLUSION" != "success" ]; then
              echo "CI concluyó '$SUITE_CONCLUSION' (no success) para PR #$pr; no se fusiona."
              echo "::endgroup::"; continue
            fi

            echo "PR #$pr es promoción $head -> $base y la CI está en verde. Habilitando auto-merge."
            gh pr merge "$pr" --repo "$REPO" --merge --auto
            echo "::endgroup::"
          done
